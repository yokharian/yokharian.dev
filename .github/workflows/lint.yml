name: Lint and Format

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  BUN_VERSION: "1.4.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Check (includes linting and formatting)
        run: bun run check
